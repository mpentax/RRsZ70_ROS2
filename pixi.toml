[workspace]
name = "z70-ros2"
channels = ["https://prefix.dev/robostack-lyrical", "https://prefix.dev/conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.14.*"
go = ">=1.24"
nodejs = ">=22"
ros-lyrical-ros-base = "*"
ros-lyrical-robot-state-publisher = "*"
ros-lyrical-xacro = "*"
ros-lyrical-foxglove-bridge = "*"
ros-lyrical-tf2-ros = "*"
ros-lyrical-sensor-msgs = "*"
ros-lyrical-cv-bridge = "*"
colcon-common-extensions = "*"
setuptools = "<80"
numpy = "*"
opencv = "*"
requests = "*"
pytest = "<9"
scipy = ">=1.18.1,<2"
mujoco = "*"

[activation.env]
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"

[tasks]
pick = { cmd = "bash -c 'source install/setup.bash && export Z70_REPO=\"$PWD\" && exec ros2 run z70_manipulation pick \"$@\"' --", depends-on = ["build"] }
stack = { cmd = "bash -c 'source install/setup.bash && export Z70_REPO=\"$PWD\" && exec ros2 run z70_manipulation stack \"$@\"' --", depends-on = ["build"] }
build = "bash deploy/build-native.sh"
bringup = { cmd = "bash -c 'source install/setup.bash && export Z70_REPO=\"$PWD\" && exec ros2 launch z70_bringup bringup.launch.py sidecars:=true manipulation:=true web_gateway:=true \"$@\"' --", depends-on = ["build"] }
sim = { cmd = "bash -c 'source install/setup.bash && export Z70_REPO=\"$PWD\" && exec ros2 launch z70_bringup bringup.launch.py sim:=true manipulation:=true web_gateway:=true garment_perception:=true garment_backend:=sim_hsv towing_qualified:=true towing_artifact_uri:=sim:mujoco-qualified \"$@\"' --", depends-on = ["build"] }
test = { cmd = "bash -c 'source install/setup.bash && export ROS_DOMAIN_ID=91 && exec python -m pytest src --basetemp build/pytest -q \"$@\"' --", depends-on = ["build"] }
